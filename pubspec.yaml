name: solvanta
description: SOLVANTA Education Platform Flutter Client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=3.19.0"

# Enable experimental Dart features used in the codebase
dart:
  enable-experiment:
    - dot-shorthands
    - null-aware-elements

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.5
  crypto: ^3.0.3
  excel: ^4.0.6
  flutter_local_notifications: ^22.3.3
  http: ^1.2.2
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.4
  pdf: ^3.11.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2
  share_plus: ^13.3.1
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/